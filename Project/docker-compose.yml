version: '2'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: telecom-db-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrongPassword123!"
      MSSQL_ALLOW_RUNNING_AS_ROOT: "1"
    ports:
      - "1433:1433"
    restart: unless-stopped

  api:
    build:
      context: ./TelecomSupportSystem
      dockerfile: TelecomSupportSystem.API/Dockerfile
    container_name: telecom-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - JWT_KEY=${JWT_KEY}
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=TelecomSupportDb;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
    depends_on:
      - sqlserver
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: telecom-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    restart: unless-stopped
