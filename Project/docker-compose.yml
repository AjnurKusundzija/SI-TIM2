services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: telecom-db-dev
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_ALLOW_RUNNING_AS_ROOT: "1"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  api:
    build:
      context: ./TelecomSupportSystem
      dockerfile: TelecomSupportSystem.API/Dockerfile
    container_name: telecom-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - JWT_KEY=${JWT_KEY}
      - ConnectionStrings__DefaultConnection=${ConnectionStrings__DefaultConnection}
    depends_on:
      - sqlserver
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: telecom-frontend
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  sqlserver-data:
