version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: telecom-db-dev
    environment:
      MYSQL_ROOT_PASSWORD: "YourPassword123!"
      MYSQL_DATABASE: TelecomDB
    ports:
      - "3306:3306"
    volumes:
      - telecom-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pYourPassword123!"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  telecom-db-data:
    driver: local
