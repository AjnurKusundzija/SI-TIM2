version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: telecom-db-dev
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "YourStrongPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - telecom-db-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  telecom-db-data:
    driver: local